service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    # Một request "tốt" khi trả lời thành công VÀ latency phía server <= 3000ms.
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  rationale: >
    Baseline đo trên máy lab (fake LLM, không incident): P95 latency ~155ms, TTFT ~50ms,
    error rate 0%. Ngưỡng 3000ms giữ đúng contract dashboard (panel latency) và là mức
    người dùng chat còn chấp nhận được; nó cao hơn baseline ~20 lần nên chỉ vi phạm khi
    có sự cố thật (ví dụ retrieval chậm hoặc tool lỗi), không vi phạm do dao động thường.
    Target 99.5% thay vì 99.9% vì phụ thuộc LLM/vector store bên ngoài.
  error_budget:
    formula: 'error_budget_requests = total_requests * (100 - target_percent) / 100'
    example: >
      10,000 request trong 28 ngày -> được phép tối đa 50 request lỗi hoặc chậm hơn 3000ms.
      Workload lab 10 request/lần chạy -> 0.05 request, tức chỉ một request xấu đã vượt budget
      của lần chạy đó; vì vậy trong lab dùng alert theo tỷ lệ trong cửa sổ 5 phút thay vì đếm.
    burn_rate_policy: >
      Nếu tiêu quá 50% budget trong 7 ngày: dừng promote prompt/model mới, ưu tiên ổn định.
      Nếu hết budget: chỉ cho phép thay đổi sửa lỗi hoặc rollback.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
